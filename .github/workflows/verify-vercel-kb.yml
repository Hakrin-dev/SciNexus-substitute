name: verify-vercel-kb

# 临时冒烟验证工作流(境外 Runner 访问 vercel.app):
# 验证知识底座环境变量配置后的完整链路;结果写回 verify-results.md。
# 验证完成后应删除本文件及 verify-results.md。(trigger 2)
on:
  push:
    paths:
      - .github/workflows/verify-vercel-kb.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Smoke test knowledge base on Vercel
        run: |
          BASE="https://scinexus-five.vercel.app"
          {
            echo "# Vercel 知识底座冒烟验证结果"
            echo ""
            echo "- 时间(UTC): $(date -u)"
            echo ""

            echo "## 1. /api/knowledge/health"
            echo '```json'
            curl -s -m 60 "$BASE/api/knowledge/health" || echo "CURL_FAILED"
            echo ""
            echo '```'
            echo ""

            echo "## 2. /api/v1/knowledge/discover (随机论文)"
            echo '```json'
            DISC=$(curl -s -m 60 "$BASE/api/v1/knowledge/discover")
            echo "$DISC" | jq '{success: .success, meta: .data.meta, results_count: (.data.results | length), first_paper: (.data.results[0] | {id, paper_id, title, conference, year, pdfUrl})}' || echo "$DISC" | head -c 600
            echo '```'
            echo ""

            echo "## 3. /api/v1/knowledge/search (graph neural network, top_k=3)"
            echo '```json'
            SRCH=$(curl -s -m 60 -X POST "$BASE/api/v1/knowledge/search" \
              -H "Content-Type: application/json" \
              -d '{"query":"graph neural network","top_k":3,"year_gte":2022,"year_lte":2026,"conference":[],"author":[],"keyword":[],"subject":[]}')
            echo "$SRCH" | head -c 600
            PAPER_ID=$(echo "$SRCH" | jq -r '(.data.results // .results // [])[0] | .paper_id // .paperId // ""' 2>/dev/null)
            echo ""
            echo '```'
            echo ""

            echo "## 4. /api/v1/knowledge/paper (详情, paperId 取自搜索结果)"
            echo '```json'
            if [ -n "$PAPER_ID" ]; then
              ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$PAPER_ID")
              curl -s -m 60 "$BASE/api/v1/knowledge/paper?paperId=$ENC" | head -c 500
            else
              echo "NO_PAPER_ID_FROM_SEARCH"
            fi
            echo ""
            echo '```'
            echo ""

            echo "## 5. /api/v1/knowledge/graph (引用图谱, depth=1)"
            echo '```json'
            if [ -n "$PAPER_ID" ]; then
              ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$PAPER_ID")
              curl -s -m 60 "$BASE/api/v1/knowledge/graph?paperId=$ENC&depth=1" | head -c 400
            else
              echo "NO_PAPER_ID_FROM_SEARCH"
            fi
            echo ""
            echo '```'
            echo ""

            echo "## 6. /api/papers/{paperId}/pdf (服务端 PDF 代理)"
            echo '```'
            if [ -n "$PAPER_ID" ]; then
              ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$PAPER_ID")
              curl -s -m 90 -o /dev/null -w "HTTP %{http_code}, Content-Type: %{content_type}, 大小: %{size_download} bytes" \
                "$BASE/api/papers/$ENC/pdf?source=remote_knowledge_base" || echo "CURL_FAILED"
            else
              echo "NO_PAPER_ID_FROM_SEARCH"
            fi
            echo ""
            echo '```'
            echo ""

            echo "## 7. 首页"
            echo '```'
            curl -s -m 60 -o /dev/null -w "HTTP %{http_code}, 总耗时 %{time_total}s" "$BASE/" || echo "CURL_FAILED"
            echo ""
            echo '```'
          } > verify-results.md
          cat verify-results.md

      - name: Commit results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify-results.md
          git commit -m "ci: vercel 知识底座冒烟验证结果(临时,验证后删除)" || echo "no changes"
          git push
