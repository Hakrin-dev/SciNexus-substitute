# 放在 ECS 的 /opt/shenzhi/ 下使用
# 镜像来自 GitHub Container Registry（ghcr.io），由 GitHub Actions 构建推送
# 注意:首次推送后需在 GitHub Packages 将该镜像设为 Public，否则 ECS 拉取需先 docker login ghcr.io
services:
  web:
    image: ghcr.io/hakrin-dev/shenzhi-frontend:latest
    ports:
      - "80:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
